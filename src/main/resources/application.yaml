server:
  port: 8080

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # Los access tokens de Cognito no traen claim "aud" (a diferencia
          # de Azure), así que acá no se usa "audiences" — la validación
          # de a qué app pertenece el token la hace CognitoTokenValidator
          # contra el claim "client_id" (ver SecurityConfig).
          issuer-uri: ${COGNITO_ISSUER_URI}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

cognito:
  client-id: ${COGNITO_CLIENT_ID}
  required-scope: ${COGNITO_REQUIRED_SCOPE:https://api.cleanfresh.com/access_as_user}
  # Dominio del Hosted UI (https://<prefijo>.auth.<region>.amazoncognito.com): se usa para
  # pedir el nombre legible del usuario (Spec 032). Opcional: vacío = se usa el username.
  domain: ${COGNITO_DOMAIN:}

microservices:
  orders:
    base-url: ${ORDERS_SERVICE_URL:http://localhost:8081}
  catalog:
    base-url: ${CATALOG_SERVICE_URL:http://localhost:8082}
  reportes:
    base-url: ${REPORTES_SERVICE_URL:http://localhost:8084}
  auditoria:
    base-url: ${AUDITORIA_SERVICE_URL:http://localhost:8085}
  notificaciones:
    base-url: ${NOTIFICACIONES_SERVICE_URL:http://localhost:8083}
